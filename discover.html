<!DOCTYPE html>
<html>
<head>
    <title>Discover Your Career</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<p><a class="home-btn" href="index.html">Return to Home Page</a></p>

<div class="home-center">
<h1>Career Discovery Quiz</h1>

<form id="quiz">

<p>I enjoy solving technical problems.</p>
<select id="q1">
    <option value="developer">Strongly Agree</option>
    <option value="analyst">Neutral</option>
    <option value="erp">Disagree</option>
</select>

<p>I enjoy identifying risks and protecting systems.</p>
<select id="q2">
    <option value="cyber">Strongly Agree</option>
    <option value="developer">Neutral</option>
    <option value="erp">Disagree</option>
</select>

<p>I enjoy working with data and dashboards.</p>
<select id="q3">
    <option value="analyst">Strongly Agree</option>
    <option value="developer">Neutral</option>
    <option value="cyber">Disagree</option>
</select>

<p>I like improving business processes.</p>
<select id="q4">
    <option value="erp">Strongly Agree</option>
    <option value="analyst">Neutral</option>
    <option value="developer">Disagree</option>
</select>

<br><br>

<button type="button" onclick="calculateCareer()">
Find My Career
</button>

</form>

<h2 id="result"></h2>

<script>

function calculateCareer(){

let scores = {
cyber:0,
developer:0,
analyst:0,
erp:0
};

scores[document.getElementById("q1").value]++;
scores[document.getElementById("q2").value]++;
scores[document.getElementById("q3").value]++;
scores[document.getElementById("q4").value]++;

let winner = Object.keys(scores).reduce((a,b)=>
scores[a] > scores[b] ? a : b
);

const titles = {
cyber:"Cybersecurity Analyst",
developer:"Software Developer",
analyst:"Data Analyst",
erp:"ERP Consultant"
};

document.getElementById("result").innerHTML =
"Recommended Career: " + titles[winner];

// remove existing modal if present
const existing = document.querySelector('.modal-overlay');
if(existing) existing.remove();

// create modal overlay with just the career name and a learn-more link plus close button
const overlay = document.createElement('div');
overlay.className = 'modal-overlay';
overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-label="Career recommendation">
        <button class="close-btn" aria-label="Close">✖</button>
        <h2>${titles[winner]}</h2>
        <a class="learn-more" href="explore.html?career=${winner}">Learn more!</a>
    </div>
`;
// close when clicking outside modal
overlay.addEventListener('click', (e) => {
    if(e.target === overlay) overlay.remove();
});

document.body.appendChild(overlay);

// close handlers: button and Escape key
const closeBtn = overlay.querySelector('.close-btn');
if(closeBtn){
    closeBtn.addEventListener('click', () => overlay.remove());
}
const escHandler = (e) => {
    if(e.key === 'Escape'){
        overlay.remove();
        window.removeEventListener('keydown', escHandler);
    }
};
window.addEventListener('keydown', escHandler);
}

</script>

</div>

</body>
</html>
